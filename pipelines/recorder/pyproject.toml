[project]
name = "pulso-recorder"
version = "0.1.0"
description = "Record Renfe Cercanias GTFS-RT observations for Madrid into BigQuery, forever"
requires-python = ">=3.12"
dependencies = [
  "google-auth>=2.35",
  "google-cloud-bigquery>=3.25",
  "google-cloud-storage>=2.18",
  "httpx>=0.27",
]

[project.scripts]
pulso-recorder = "pulso_recorder.main:cli"

[dependency-groups]
dev = [
    "cryptography>=50.0.1",
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulso_recorder"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true

# google.cloud is a namespace package, so mypy cannot resolve its submodules as
# attributes even when the package is installed.
[[tool.mypy.overrides]]
module = ["google.cloud.*", "google.cloud"]
ignore_missing_imports = true
follow_imports = "skip"
