[project]
name = "pulso-gtfs"
version = "0.1.0"
description = "Ingest Renfe Cercanias + CRTM static GTFS for Madrid into BigQuery"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "google-auth>=2.35",
  "google-cloud-bigquery>=3.25",
  "google-cloud-storage>=2.18",
  "httpx>=0.27",
  "pyarrow>=25.0.1",
]

[project.scripts]
pulso-gtfs = "pulso_gtfs.main:cli"

[dependency-groups]
dev = [
    "cryptography>=50.0.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulso_gtfs"]

[tool.ruff]
line-length = 100
